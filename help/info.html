<!DOCTYPE html>
<style>
    @font-face {
    font-family: "BIZ UDGothic";
    src: url("../../font/BIZUDGothic-Regular.ttf") format("truetype");
}

#preview-container {
    color: #262626;
    word-wrap: break-word;
    font-family: "BIZ UDGothic";


    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        color: #1b1b1b;
    }

    h1 {
        padding-bottom: .3em;
        font-size: 2em;
        border-bottom: 1px solid hsla(210, 18%, 87%, 1);
        margin: .67em 0;
        display: block;
    }

    h2 {
        padding-bottom: .3em;
        font-size: 1.5em;
        border-bottom: 1px solid hsla(210, 18%, 87%, 1);
        display: block;

        margin-block-start: 0.83em;
        margin-block-end: 0.83em;
        margin-inline-start: 0px;
        margin-inline-end: 0px;

    }

    h3 {
        font-size: 1.25em;
        display: block;
        margin-block-start: 1em;
        margin-block-end: 1em;
        margin-inline-start: 0px;
        margin-inline-end: 0px;

    }

    h4 {
        font-size: 1em;
        display: block;
        margin-block-start: 1.33em;
        margin-block-end: 1.33em;
        margin-inline-start: 0px;
        margin-inline-end: 0px;
    }

    h5 {
        font-size: .875em;
        display: block;
        margin-block-start: 1.67em;
        margin-block-end: 1.67em;
        margin-inline-start: 0px;
        margin-inline-end: 0px;
    }

    h6 {
        font-size: .85em;
        display: block;
        margin-block-start: 2.33em;
        margin-block-end: 2.33em;
        margin-inline-start: 0px;
        margin-inline-end: 0px;

    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        margin-top: 24px;
        margin-bottom: 16px;
        font-weight: 600;
        line-height: 1.25;
    }

    .highlight pre,
    pre {
        padding: 16px;
        overflow: auto;
        font-size: 85%;
        line-height: 1.45;
        background-color: #f6f8fa;
        border-radius: 6px;
    }

    pre {
        word-wrap: normal;
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
        white-space: pre;
        margin: 1em 0px;
        border: 1px solid #e5e5e5;
    }

    p,
    blockquote,
    ul,
    ol,
    dl,
    table,
    pre,
    details {
        margin-top: 0;
        margin-bottom: 16px;
    }

    pre code,
    pre tt {
        display: inline;
        padding: 0;
        margin: 0;
        overflow: visible;
        line-height: inherit;
        word-wrap: normal;
        background-color: transparent;
        border: 0;
    }

    pre>code {
        word-break: normal;
        white-space: pre;
        background: transparent;
    }

    code {
        padding: .2em .4em;
        margin: 0;
        /* font -size: 85%; */
        white-space: break-spaces;
        background-color: #818b981f;
        border-radius: 6px;
    }

    pre code {
        font-size: 100%;
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
    }

    code,
    tt {
        border-radius: 6px;
    }


    ul,
    ol {
        padding-left: 2em;
    }

    table {
        display: block;
        width: max-content;
        max-width: 100%;
        overflow: auto;
        border-spacing: 0;
        border-collapse: collapse;

    }



    table tr {
        background-color: #ffffff;
        border-top: 1px solid hsla(210, 18%, 87%, 1);
    }

    table th,
    table td {
        padding: 6px 13px;
        border: 1px solid #d0d7de;
    }

    table tr:nth-child(2n) {
        background-color: #f6f8fa;
    }

    blockquote {
        padding: 0 1em;
        border-left: .25em solid #d0d7de;
        margin: 0;
        font-size: 0.8em;
        font-style: italic;
        color: #4d4d4d;
    }

    ul {
        display: block;
        list-style-type: disc;
        /* padding-left: 17px; */
        margin: 6px 0 10px;

    }

    .task-list-item {
        border: 0;
        list-style: none;
        padding-left: 22px;
        margin-left: -22px;
    }

    ul li.task-list-item:before {
        content: "";
    }

    ol li,
    ul li {
        line-height: 160%;
        box-sizing: content-box;
    }

    ol li,
    ul li {
        position: relative;
    }

    :not(table) {
        line-height: 160%;
        box-sizing: content-box;
    }

    .task-list-item.checked:before {
        /* background-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAAXNSR0IArs4c6QAAAMpJREFUKBVjjJ/64D8DGYCJDD1gLbTVyM3OxJDiJMzAxcYIdyALnIWDAdJU7i/OICfCxsDMxMgwc88bwk5F1vTs/W+GFUffwY2H+1FBlI2hLliCQYCbGSyJrqlzwwuGj9//YWoMtRBgUBJnZ6gMEGeQFWaFOw9kE7omkG5GWDyCPF7mJ86gIMbO8P//fwZGRkYGXJpAGuFO/fbrP0PXppcMD179JKgJRSOIA9N8/NZXrM4DqYEBjOgAaYYFOUwRNhruVGyS+MTI1ggAx8NTGcUtFVQAAAAASUVORK5CYII=); */
    }

    .task-list-item:before {
        background-repeat: no-repeat;
        background-size: 16px 16px;
        background-position: center;

        height: 18px;
        width: 18px;
        position: absolute;
        left: 0;
        top: 5px;
        cursor: pointer;
        /* background-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAAXNSR0IArs4c6QAAADdJREFUKBVjvHv37n8GMgALSI+SkhJJWu/du8fARJIOJMWjGpECA505GjjoIYLEB6dVUNojFQAA/1MJUFWet/4AAAAASUVORK5CYII=); */
    }

    .hljs {
        display: block;
        overflow-x: auto;
        padding: 0.5em;
        color: #333;
        background: #f8f8f8
    }

    .hljs-comment,
    .hljs-quote {
        color: #998;
        font-style: italic
    }

    .hljs-keyword,
    .hljs-selector-tag,
    .hljs-subst {
        color: rgb(44, 11, 133);
        font-weight: bold
    }

    .hljs-number,
    .hljs-literal,
    .hljs-variable,
    .hljs-template-variable,
    .hljs-tag .hljs-attr {
        color: #008080
    }

    .hljs-string,
    .hljs-doctag {
        color: #d14
    }

    .hljs-title,
    .hljs-section,
    .hljs-selector-id {
        color: #900;
        font-weight: bold
    }

    .hljs-subst {
        font-weight: normal
    }

    .hljs-type,
    .hljs-class .hljs-title {
        color: #458;
        font-weight: bold
    }

    .hljs-tag,
    .hljs-name,
    .hljs-attribute {
        color: #000080;
        font-weight: normal
    }

    .hljs-regexp,
    .hljs-link {
        color: #009926
    }

    .hljs-symbol,
    .hljs-bullet {
        color: #990073
    }

    .hljs-built_in,
    .hljs-builtin-name {
        color: #006283
    }

    .hljs-meta {
        color: #999;
        font-weight: bold
    }

    .hljs-deletion {
        background: #fdd
    }

    hr {
        height: .25em;
        padding: 0;
        margin: 24px 0;
        background-color: #d0d7de;
        border: 0;
    }

    a {
        color: #0969da;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    img {
        max-width: 100%;
        height: 100%;
    }
}
